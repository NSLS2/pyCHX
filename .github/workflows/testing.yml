name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

env:
  # Keep self-hosted and developer-like runners from satisfying dependencies
  # with unrelated packages installed in the runner account's user site.
  PYTHONNOUSERSITE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    runs-on: ${{ matrix.host-os }}
    strategy:
      matrix:
        host-os: ["ubuntu-latest"]
        # host-os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11.6", "3.12", "3.13", "3.14"]
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Set env vars
        run: |
          export REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}  # just the repo, as opposed to org/repo
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> $GITHUB_ENV

      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # For reference: https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html.
          set -vxeuo pipefail

          # These packages are installed in the base environment but may be older
          # versions. Explicitly upgrade them because they often create
          # installation problems if out of date.
          python -m pip install --upgrade pip setuptools numpy

          python -m pip install ".[test]"
          python -m pip list

      - name: Test with pytest
        run: |
          set -vxeuo pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run -m pytest -m portable -vv -s
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run --append -m pytest -m mocked_facility -vv -s
          python -m coverage report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          set -vxeuo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Test the installed wheel outside the source tree
        run: |
          set -vxeuo pipefail
          python -m venv "${RUNNER_TEMP}/pychx-wheel-test"
          "${RUNNER_TEMP}/pychx-wheel-test/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/pychx-wheel-test/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pychx-wheel-test/bin/python" -c "import pyCHX; import pyCHX.chx_packages"

  data_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # eiger-io's pinned legacy Versioneer uses SafeConfigParser, which
          # was removed in Python 3.12. Keep this one reader-specific job on
          # the oldest supported Python until eiger-io's packaging is updated.
          python-version: "3.11.6"
      - name: Install data-regression dependencies
        run: |
          set -vxeuo pipefail
          python -m pip install --upgrade pip setuptools
          python -m pip install ".[test,facility]"
          python -m pip install --group facility-source
      - name: Run ds1 characterization and regression tests
        run: |
          # A numerical mismatch requires review; it is not by itself proof that
          # the new implementation is wrong. See test_ds1_regression.py.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -m data_regression -vv -s

  prerelease_dependencies:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pre-release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre ".[test]"
      - name: Exercise pyCHX with future dependencies
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -m "portable or mocked_facility" -vv

  live_facility:
    if: github.event_name == 'workflow_dispatch'
    needs: [run_tests, package]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install ".[test,facility]"
          python -m pip install --group facility-source
      - name: Test live facility integration
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -m live_facility --live-facility -vv -s
