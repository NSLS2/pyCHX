name: Lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flake8
        run: python -m pip install flake8==7.3.0
      - name: Run Flake8
        run: flake8 pyCHX
